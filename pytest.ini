# -*- coding: utf-8 -*-
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

markers =
    unit: Unit tests for pure functions with no external dependencies
    integration: Integration tests across multiple modules (DB, network mock)
    api: API contract tests for AppRuntime public surface
    performance: Performance benchmark regression with timing assertions
    security: Security tests for SQL injection, auth bypass, input validation
    slow: Slow tests (>1s) that CI may skip on demand
    ctf: CTF clue extraction and forensics tests
    detection: Detection pipeline tests (rules + ML model)
    capture: Capture engine tests
    offline: Offline import/parsing tests
